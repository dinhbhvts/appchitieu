name: Thông báo nhắc sự kiện hàng ngày

# Gọi POST /push/run-daily trên backend Render 2 lần mỗi ngày - Render free tier
# không có cron riêng và "ngủ" khi không ai dùng, nên cần một thứ bên ngoài
# đánh thức + kích hoạt việc gửi thông báo giúp. Xem TRIEN_KHAI.md mục 7.
#
# Cần khai báo trước 2 Repository secret (Settings > Secrets and variables >
# Actions):
#   VIBEAPP_BACKEND_URL  = địa chỉ backend, vd https://vibeapp-xxx.onrender.com
#   VIBEAPP_CRON_SECRET  = phải giống hệt biến NOTIFY_CRON_SECRET đã đặt trên Render

on:
  schedule:
    # GitHub xếp hàng các cron đúng đầu giờ (phút 0) rất đông nên hay bị trễ,
    # vì vậy hai giờ dưới đây đều đặt lệch phút để job chạy đúng giờ hơn.
    - cron: "30 1 * * *" # 01:30 UTC = 08:30 sáng giờ Việt Nam (UTC+7)
    - cron: "5 7 * * *" # 07:05 UTC = 14:05 chiều giờ Việt Nam (UTC+7)
  workflow_dispatch: {} # cho phép bấm "Run workflow" để thử tay trên GitHub

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi /push/run-daily (chờ Render thức dậy nếu đang ngủ, tự thử lại nếu lần đầu lỗi)
        run: |
          curl --fail --show-error --silent \
            --max-time 240 \
            --retry 2 --retry-delay 15 --retry-all-errors \
            -X POST "${{ secrets.VIBEAPP_BACKEND_URL }}/push/run-daily" \
            -H "X-Cron-Secret: ${{ secrets.VIBEAPP_CRON_SECRET }}"
