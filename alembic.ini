# Alembic configuration. Alembic manages database schema changes over time
# (adding a column, a new table, ...) in a safe, versioned way for production.
# In development the app also auto-creates tables on startup, so you only need
# Alembic when you deploy with PostgreSQL.

[alembic]
script_location = alembic
prepend_sys_path = .
# The actual database URL is injected from app settings in alembic/env.py,
# so we leave it blank here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
